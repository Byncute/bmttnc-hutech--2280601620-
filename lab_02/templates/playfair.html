<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>PlayFair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-4">
    <h3>PlayFair Cipher</h3>

    <form method="POST" action="/encrypt_playfair">
        <div class="mb-3">
            <label>Plain text:</label>
            <input type="text" name="inputPlainText" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Key (text):</label>
            <input type="text" name="inputKey" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>

    <form method="POST" action="/decrypt_playfair" class="mt-3">
        <div class="mb-3">
            <label>Cipher text:</label>
            <input type="text" name="inputCipherText" class="form-control" required />
        </div>
        <div class="mb-3">
            <label>Key (text):</label>
            <input type="text" name="inputKey" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Decrypt</button>
    </form>

    {% if result %}
    <div class="alert alert-info mt-3">
        <strong>Kết quả:</strong> {{ result }}
    </div>
    {% endif %}
</div>
</body>
</html>
