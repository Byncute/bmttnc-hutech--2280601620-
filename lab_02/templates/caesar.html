<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-4">
    <h3>Decrypt Caesar Cipher</h3>
    <form method="POST" action="/decrypt">
        <div class="mb-3">
            <label class="form-label">Cipher text:</label>
            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Caesar Cipher Text" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key" required/>
        </div>
        <button type="submit" class="btn btn-success">Decrypt</button>
    </form>

    <hr/>

    <h3>Encrypt Caesar Cipher</h3>
    <form method="POST" action="/encrypt">
        <div class="mb-3">
            <label class="form-label">Plain text:</label>
            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key" required/>
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>
</div>
</body>
</html>
