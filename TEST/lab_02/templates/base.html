<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Cipher Lab" }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .header-logos img {
            max-height: 80px;
            margin: 10px;
        }
        .main-title {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }
        .sub-title {
            font-size: 18px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="text-center bg-light py-3">
        <div class="header-logos d-flex justify-content-center align-items-center">
            <img src="{{ url_for('static', filename='logo_hutech.png') }}" alt="Logo HUTECH">
<img src="{{ url_for('static', filename='logo_30nam.png') }}" alt="Logo 30 năm">

        </div>
        <div class="main-title">BÀI KIỂM TRA KẾT THÚC MÔN HỌC: THBMTTNC</div>
        <div class="sub-title">HỒ TUẤN KIỆT - GLHF !</div>
    </div>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-white text-center mt-4 py-2">
        <small>&copy; 2025 - HUTECH - Bảo mật thông tin nâng cao</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
